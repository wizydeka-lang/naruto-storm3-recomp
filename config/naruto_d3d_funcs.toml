# Xbox 360 Direct3D functions in Naruto Shippuden: Ultimate Ninja Storm 3
# Full Burst's default.xex (SHA-256 da6d872d...4fcd), for a native renderer
# that hooks the game's D3D calls. Addresses only match that executable.
#
# Found by analysing this project's own generated code and runtime behaviour
# (see docs/d3d-functions.md); names follow the Xbox 360 XDK.

[functions]
# Draws and shaders: argument patterns at the engine's call sites, per-draw
# call counts (342 draws/frame in the trace), and the device fields written.
0x82746748 = {name = "D3DDevice_Swap"}               # calls VdGetSystemCommandBuffer/VdSwap; exactly 1/frame
